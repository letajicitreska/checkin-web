backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "cs"

collections:
  - name: "stranky"
    label: "Texty na webu"
    files:
      - name: "uvod"
        label: "Úvod (Domů) a video"
        file: "content/site.json"
        fields:
          - { label: "Video na pozadí (nahraj mp4)", name: "hero_video", widget: "file", required: false, hint: "Krátké video ve smyčce, ideálně pod 15 MB." }
          - { label: "Náhledová fotka (než se video načte)", name: "hero_poster", widget: "image", required: false }
          - { label: "Nadpis (Vítejte!)", name: "hero_heading", widget: "string" }
          - { label: "Úvodní text", name: "hero_text", widget: "text" }
          - { label: "Text tlačítka", name: "hero_cta_label", widget: "string" }
          - { label: "Odkaz tlačítka", name: "hero_cta_link", widget: "string" }

          - { label: "Nadpis sekce aktualit", name: "news_heading", widget: "string" }
          - { label: "Nadpis fotogalerie na Domů", name: "gallery_heading", widget: "string" }
          - { label: "Text tlačítka k fotogalerii", name: "gallery_cta_label", widget: "string" }
          - { label: "Odkaz k fotogalerii", name: "gallery_cta_link", widget: "string" }

          - { label: "Kontakt — název", name: "contact_name", widget: "string" }
          - { label: "Kontakt — adresa", name: "contact_address", widget: "string" }
          - { label: "Kontakt — e-mail", name: "contact_email", widget: "string" }
          - { label: "Kontakt — telefon", name: "contact_phone", widget: "string", required: false }

      - name: "onas"
        label: "Stránka O nás"
        file: "content/o-nas.json"
        fields:
          - { label: "Banner fotka nahoře na stránce", name: "o_nas_banner_image", widget: "image", required: false }
          - { label: "Nadpis", name: "o_nas_heading", widget: "string" }
          - { label: "Úvodní text (prázdný řádek = nový odstavec)", name: "o_nas_intro", widget: "text" }
          - { label: "Fotka mezi odstavci #1", name: "o_nas_image_1", widget: "image", required: false }

          - { label: "Nadpis: Jak check.in vznikl?", name: "o_nas_h2_vznik", widget: "string" }
          - { label: "Text: Jak check.in vznikl?", name: "o_nas_text_vznik", widget: "text" }

          - { label: "Nadpis: Pro koho je check.in?", name: "o_nas_h2_prokoho", widget: "string" }
          - { label: "Text: Pro koho je check.in?", name: "o_nas_text_prokoho", widget: "text" }
          - { label: "Fotka mezi odstavci #2", name: "o_nas_image_2", widget: "image", required: false }

          - { label: "Nadpis: Jak (spolu)pracujeme?", name: "o_nas_h2_spolupraca", widget: "string" }
          - { label: "Text: Jak (spolu)pracujeme?", name: "o_nas_text_spolupraca", widget: "text" }

          - { label: "Nadpis: Proč zrovna check.in?", name: "o_nas_h2_proc", widget: "string" }
          - { label: "Text: Proč zrovna check.in?", name: "o_nas_text_proc", widget: "text" }

      - name: "repertoar"
        label: "Stránka Repertoár"
        file: "content/repertoar.json"
        fields:
          - { label: "Banner fotka nahoře", name: "repertoar_banner_image", widget: "image", required: false }
          - { label: "Název představení", name: "repertoar_heading", widget: "string" }
          - { label: "Text o představení (prázdný řádek = nový odstavec)", name: "repertoar_text", widget: "text" }
          - { label: "Choreografie/režie", name: "repertoar_credit", widget: "string" }

      - name: "pridejtese"
        label: "Stránka Přidejte se k nám (úvod)"
        file: "content/pridejte.json"
        fields:
          - { label: "Banner fotka nahoře", name: "pridejte_banner_image", widget: "image", required: false }
          - { label: "Nadpis", name: "join_heading", widget: "string" }
          - { label: "Úvodní text (může obsahovat HTML odkazy)", name: "join_intro", widget: "text" }
          - { label: "Nadpis: Pro koho je check.in?", name: "join_prokoho_heading", widget: "string" }
          - { label: "Text: Pro koho je check.in?", name: "join_prokoho_text", widget: "text" }
          - { label: "Text tlačítka Napište nám", name: "join_cta_label", widget: "string" }
          - { label: "Odkaz/e-mail tlačítka", name: "join_cta_link", widget: "string" }

      - name: "spolupracujte"
        label: "Stránka Spolupracujte s námi"
        file: "content/spolupracujte.json"
        fields:
          - { label: "Banner fotka nahoře", name: "spolupracujte_banner_image", widget: "image", required: false }
          - { label: "Nadpis", name: "collab_heading", widget: "string" }
          - { label: "Text", name: "collab_text", widget: "text", required: false }

  - name: "terminy"
    label: "Aktuální termíny / workshopy"
    files:
      - name: "seznam"
        label: "Seznam termínů (karty na Domů)"
        file: "content/workshops.json"
        fields:
          - label: "Termíny"
            name: "items"
            widget: "list"
            fields:
              - { label: "Fotka", name: "image", widget: "image", required: false }
              - { label: "Malý štítek nad nadpisem (např. Repríza: Check-in)", name: "tag", widget: "string", required: false }
              - { label: "Název akce", name: "title", widget: "string" }
              - { label: "Odkaz (přihláška apod.)", name: "link", widget: "string", required: false }

  - name: "galerie"
    label: "Fotogalerie — Domů"
    files:
      - name: "fotky"
        label: "Fotky"
        file: "content/gallery.json"
        fields:
          - label: "Fotky"
            name: "items"
            widget: "list"
            fields:
              - { label: "Fotka", name: "image", widget: "image", required: false }
              - { label: "Popisek", name: "caption", widget: "string", required: false }

  - name: "galerie_repertoar"
    label: "Fotogalerie — Repertoár"
    files:
      - name: "fotky"
        label: "Fotky"
        file: "content/repertoar-gallery.json"
        fields:
          - label: "Fotky"
            name: "items"
            widget: "list"
            fields:
              - { label: "Fotka", name: "image", widget: "image", required: false }
              - { label: "Popisek", name: "caption", widget: "string", required: false }
